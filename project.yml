name: TeamSpace
options:
  bundleIdPrefix: com.native
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ko
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TeamSpace:
    type: application
    platform: iOS
    sources:
      - path: TeamSpace
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: TeamSpace
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        API_BASE_URL: $(API_BASE_URL)
        USE_MOCK_API: $(USE_MOCK_API)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.native.teamspace
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: "\"TeamSpace/Resources/Preview Content\""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  TeamSpaceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TeamSpaceTests
    dependencies:
      - target: TeamSpace
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TeamSpace:
    build:
      targets:
        TeamSpace: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [TeamSpaceTests]
